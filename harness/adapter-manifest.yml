version: 1
protocol:
  protocol_id: "autonomous-development-lifecycle"
  protocol_version: "2026-03-28"
  required_lifecycle:
    - "issue"
    - "claim"
    - "drive"
    - "ship"
    - "rc"
adapter:
  adapter_id: "codex-native-harness"
  adapter_version: "0.84.0-prototype"
  public_name: "Harness"
  release_stage: "prototype"
  positioning_adr: "_project/decisions/0013-harness-prototype-positioning.md"
  runtime: "codex"
  public_contract_path: "docs/harness-public-contract.md"
  package_files:
    - "docs/harness-public-contract.md"
    - "install-codex.sh"
    - "go.mod"
    - "go.sum"
    - "cmd/harness-state/main.go"
    - "internal/harness/runtime.go"
    - "scripts/harness-build-runtime.sh"
    - "scripts/harness-package-runtime.sh"
    - "scripts/harness-runtime.sh"
    - "scripts/harness-adapter.sh"
    - "scripts/harness-missions.sh"
    - "scripts/harness-home.sh"
    - "scripts/harness-doctor.sh"
    - "scripts/harness-issue.sh"
    - "scripts/harness-claim.sh"
    - "scripts/harness-drive.sh"
    - "scripts/harness-teammates.sh"
    - "scripts/harness-ship.sh"
    - "scripts/harness-rc.sh"
    - "scripts/harness-meetings.sh"
    - "scripts/harness-maintenance.sh"
    - "scripts/harness-profile.sh"
    - "scripts/harness-paths.sh"
    - "scripts/harness-runs.sh"
    - "scripts/harness-signals.sh"
    - "scripts/harness-contracts.sh"
    - "scripts/harness-git.sh"
    - "scripts/harness-bootstrap.sh"
    - "scripts/harness-sync.sh"
    - "scripts/harness-issue-smoke-test.sh"
    - "scripts/harness-smoke-test.sh"
    - "scripts/harness-release-smoke-test.sh"
    - "scripts/harness-teammate-smoke-test.sh"
    - "scripts/harness-runtime-dist-smoke-test.sh"
    - "scripts/harness-runtime-package-smoke-test.sh"
    - "scripts/harness-bootstrap-smoke-test.sh"
    - "scripts/harness-all-smoke-test.sh"
    - "harness/README.md"
    - "harness/adapter-manifest.yml"
    - "harness/bin/README.md"
    - "harness/bootstrap/profile-template.yml"
    - "harness/templates/contract.yml"
    - "harness/templates/issue.md"
    - "harness/templates/mission.yml"
    - "harness/templates/pr.md"
    - "harness/templates/run.yml"
    - "harness/templates/signal.yml"
    - "harness/templates/meeting.yml"
    - "harness/templates/rc.yml"
    - "harness/policies/defaults.yml"
    - "skills/harness/SKILL.md"
    - "skills/harness/README.md"
    - "skills/harness/CHANGELOG.md"
  bootstrap:
    profile_template: "harness/bootstrap/profile-template.yml"
    generated_profile_path: "harness/profiles/default.yml"
    metadata_path: ".harness/cache/adapter-source.json"
  profile_contract:
    committed_profiles_root: "harness/profiles"
    runtime_local_override_path: ".harness/profile.local.yml"
    default_profile_hint: "harness/profiles/default.yml"
  capability_surfaces:
    - "missions"
    - "issue"
    - "claim"
    - "drive"
    - "teammates"
    - "ship"
    - "rc"
    - "meetings"
    - "maintenance"
  ship_capabilities:
    - "push"
    - "pr-draft"
    - "pr-open"
    - "review-gates"
    - "checks-gates"
    - "deterministic-merge"
    - "cleanup"
  rc_capabilities:
    - "create"
    - "verify"
    - "promote"
    - "close"
    - "fix"
    - "cancel"
    - "hotfix"
    - "backport"
  smoke_scripts:
    - "./scripts/harness-issue-smoke-test.sh"
    - "./scripts/harness-smoke-test.sh"
    - "./scripts/harness-release-smoke-test.sh"
    - "./scripts/harness-teammate-smoke-test.sh"
    - "./scripts/harness-runtime-dist-smoke-test.sh"
    - "./scripts/harness-runtime-package-smoke-test.sh"
    - "./scripts/harness-bootstrap-smoke-test.sh"
    - "./scripts/harness-all-smoke-test.sh"
